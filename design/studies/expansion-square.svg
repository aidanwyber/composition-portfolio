<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
<title>As The Sun Rises — experimental expansion study</title>
<desc>Eighteen open angles share a turning point; each arm grows by ten units and shifts five units. A proposal about development and open space, not cosmological illustration. No randomness. Not approved artwork.</desc>
